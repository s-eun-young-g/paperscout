[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperscout"
version = "0.1.0"
description = "A configurable literature radar + biomedical relation miner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sofia Guerra" }]
keywords = ["literature", "scraper", "openalex", "europepmc", "drug-target", "relation-extraction"]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
paperscout = "paperscout.cli:app"

[project.urls]
Homepage = "https://github.com/s-eun-young-g/paperscout"

[tool.hatch.build.targets.wheel]
packages = ["paperscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
